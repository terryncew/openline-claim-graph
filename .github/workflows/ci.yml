name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install build and runtime dependencies
        run: |
          python -m pip install "setuptools>=68" wheel
          python -m pip install --no-build-isolation .
      - name: Unit and hostile tests
        run: python -m unittest discover -s tests -v
      - name: Build controlled demo
        run: python examples/build_demo.py --output "${{ runner.temp }}/claim-graph-demo"
      - name: Build natural-material review
        run: python examples/build_plos_correction_case.py --output "${{ runner.temp }}/plos-correction-case"
      - name: Build and independently verify evidence recall
        run: |
          python examples/build_plos_correction_case.py --output "${{ runner.temp }}/plos-correction-case"
          cp artifacts/plos-correction-case/upstream-verification.json \
            "${{ runner.temp }}/plos-correction-case/upstream-verification.json"
          python examples/build_plos_correction_impact.py \
            --base "${{ runner.temp }}/plos-correction-case" \
            --output "${{ runner.temp }}/plos-correction-impact"
          python scripts/verify_plos_correction_impact.py \
            --artifact "${{ runner.temp }}/plos-correction-impact"
          python scripts/impact_differential_probe.py --iterations 2000
      - name: Run scaling probe
        run: python scripts/scaling_probe.py
      - name: Build and validate automated receiver development pack
        run: |
          python scripts/build_arct_automated_receiver_pack.py --output "${{ runner.temp }}/automated-receiver-benchmark"
          python -m openline_claim_graph benchmark-validate \
            --pack "${{ runner.temp }}/automated-receiver-benchmark/pack.json" \
            --gold "${{ runner.temp }}/automated-receiver-benchmark/gold.private.json"
      - name: Build and independently verify Frame Ledger specimen
        run: |
          python examples/build_wapo_frame_ledger.py \
            --output "${{ runner.temp }}/wapo-headline-frame-ledger"
          python scripts/verify_wapo_frame_ledger.py \
            --artifact "${{ runner.temp }}/wapo-headline-frame-ledger"
      - name: Build and verify Evidence Recall comparative benchmark pipeline
        run: |
          python scripts/build_evidence_recall_comparative_fixture.py \
            --output "${{ runner.temp }}/evidence-recall-comparative"
          python -m openline_claim_graph evidence-benchmark-validate \
            --pack "${{ runner.temp }}/evidence-recall-comparative/pack.json" \
            --authority "${{ runner.temp }}/evidence-recall-comparative/authority.json" \
            --gold "${{ runner.temp }}/evidence-recall-comparative/gold.private.json" \
            --predictions "${{ runner.temp }}/evidence-recall-comparative/predictions.json" \
            --score "${{ runner.temp }}/evidence-recall-comparative/score.json"
          python -m openline_claim_graph evidence-benchmark-published-diagnostic \
            --output "${{ runner.temp }}/published-diagnostic.json"
          python scripts/verify_evidence_recall_published_diagnostic.py \
            --report "${{ runner.temp }}/published-diagnostic.json"
      - name: Build and verify Evidence Recall temporal holdout pipeline
        run: |
          python scripts/build_temporal_holdout_fixture.py \
            --output "${{ runner.temp }}/evidence-recall-temporal"
          python -m openline_claim_graph temporal-benchmark-validate \
            --pack "${{ runner.temp }}/evidence-recall-temporal/pack.json" \
            --authority "${{ runner.temp }}/evidence-recall-temporal/authority.json" \
            --future-seal "${{ runner.temp }}/evidence-recall-temporal/future-seal.private.json" \
            --gold "${{ runner.temp }}/evidence-recall-temporal/gold.private.json" \
            --predictions "${{ runner.temp }}/evidence-recall-temporal/predictions.json" \
            --score "${{ runner.temp }}/evidence-recall-temporal/score.json"
          python -m openline_claim_graph temporal-benchmark-published-diagnostic \
            --output "${{ runner.temp }}/temporal-published-diagnostic.json"
          python scripts/verify_temporal_published_diagnostic.py \
            --report "${{ runner.temp }}/temporal-published-diagnostic.json" \
            --output "${{ runner.temp }}/temporal-independent-verification.json"
          python scripts/build_real_temporal_case_shah_iron.py \
            --output "${{ runner.temp }}/temporal-real-001-shah-iron"
          python scripts/verify_real_temporal_case_shah_iron.py \
            --artifact "${{ runner.temp }}/temporal-real-001-shah-iron" \
            --output "${{ runner.temp }}/temporal-real-001-shah-iron/independent-verification.json"
          python -m openline_claim_graph temporal-benchmark-validate \
            --pack "${{ runner.temp }}/temporal-real-001-shah-iron/pack.json" \
            --authority "${{ runner.temp }}/temporal-real-001-shah-iron/authority.json" \
            --future-seal "${{ runner.temp }}/temporal-real-001-shah-iron/future-seal.private.json" \
            --gold "${{ runner.temp }}/temporal-real-001-shah-iron/gold.private.json" \
            --predictions "${{ runner.temp }}/temporal-real-001-shah-iron/predictions.json" \
            --score "${{ runner.temp }}/temporal-real-001-shah-iron/score.json"
          python scripts/build_temporal_selectivity_replication_corpus.py \
            --output "${{ runner.temp }}/temporal-replication-001-selectivity"
          python scripts/verify_temporal_selectivity_replication_corpus.py \
            --artifact "${{ runner.temp }}/temporal-replication-001-selectivity" \
            --output "${{ runner.temp }}/temporal-replication-001-selectivity/independent-verification.json"
          python -m openline_claim_graph temporal-benchmark-validate \
            --pack "${{ runner.temp }}/temporal-replication-001-selectivity/pack.json" \
            --authority "${{ runner.temp }}/temporal-replication-001-selectivity/authority.json" \
            --future-seal "${{ runner.temp }}/temporal-replication-001-selectivity/future-seal.private.json" \
            --gold "${{ runner.temp }}/temporal-replication-001-selectivity/gold.private.json" \
            --predictions "${{ runner.temp }}/temporal-replication-001-selectivity/predictions.json" \
            --score "${{ runner.temp }}/temporal-replication-001-selectivity/score.json"
      - name: Build and verify prospective Decision Recall mechanics
        run: |
          python scripts/build_decision_recall_prospective_fixture.py \
            --output "${{ runner.temp }}/decision-recall-prospective-conformance"
          python -I scripts/verify_decision_recall_prospective_fixture.py \
            --artifact "${{ runner.temp }}/decision-recall-prospective-conformance" \
            --output "${{ runner.temp }}/decision-recall-prospective-conformance/independent-verification.json"
          printf 'independent-seed-after-seal' > "${{ runner.temp }}/decision-recall-seed.bin"
          python scripts/select_controlled_revocations.py \
            --stream-seal "${{ runner.temp }}/decision-recall-prospective-conformance/stream-seal.json" \
            --seed-file "${{ runner.temp }}/decision-recall-seed.bin" \
            --count 3 \
            --selection-at "2026-08-18T03:59:00Z" \
            --event-at "2026-08-18T04:00:00Z" \
            --output "${{ runner.temp }}/decision-recall-controlled-plan.json"
          python scripts/decision_recall_benchmark.py --help >/dev/null
          python scripts/cohort001.py --root . status > "${{ runner.temp }}/cohort-001-status.json"
          cat "${{ runner.temp }}/cohort-001-status.json"
          python - <<'PY'
          import importlib.util
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          if os.environ.get("GITHUB_EVENT_NAME") != "push":
              raise SystemExit(0)

          root = Path(".").resolve()
          designation_rel = Path(
              "experiments/decision-recall-prospective-001/cohort-001/DESIGNATION.json"
          )
          designation = json.loads(
              (root / designation_rel).read_text(encoding="utf-8")
          )
          expected_rule = "LATEST_GIT_COMMIT_MODIFYING_DESIGNATION_THEN_DESCENDANTS_ONLY"
          if designation.get("activation_rule") != expected_rule:
              print("Unexpected Cohort 001 activation rule.", file=sys.stderr)
              raise SystemExit(2)

          activation = subprocess.run(
              ["git", "log", "-1", "--format=%H", "--", designation_rel.as_posix()],
              cwd=root,
              text=True,
              capture_output=True,
              check=True,
          ).stdout.strip()
          if not activation:
              print("Could not resolve Cohort 001 activation commit.", file=sys.stderr)
              raise SystemExit(2)

          spec = importlib.util.spec_from_file_location(
              "cohort001_frozen", root / "scripts/cohort001.py"
          )
          if spec is None or spec.loader is None:
              print("Could not load frozen Cohort 001 manager.", file=sys.stderr)
              raise SystemExit(2)
          cohort001 = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(cohort001)

          represented = set()
          ledger_root = root / "artifacts/decision-recall-prospective/cohort-001"
          for kind in ("observations", "exclusions"):
              for path in sorted((ledger_root / kind).glob("*.json")):
                  value = json.loads(path.read_text(encoding="utf-8"))
                  digest = value.get("subject_change_set_sha256", "")
                  if digest:
                      represented.add(digest)

          commits = subprocess.run(
              ["git", "rev-list", "--reverse", f"{activation}..HEAD"],
              cwd=root,
              text=True,
              capture_output=True,
              check=True,
          ).stdout.splitlines()

          patterns = designation.get("change_set_exclude_globs", [])
          unclassified = []
          for commit in commits:
              change = cohort001.change_set_from_commit(root, commit, patterns)
              if not change["entries"]:
                  continue
              if change["change_set_sha256"] in represented:
                  continue
              subject = subprocess.run(
                  ["git", "show", "-s", "--format=%s", commit],
                  cwd=root,
                  text=True,
                  capture_output=True,
                  check=True,
              ).stdout.strip()
              unclassified.append(
                  {
                      "commit": commit,
                      "subject": subject,
                      "change_set_sha256": change["change_set_sha256"],
                  }
              )

          print(
              json.dumps(
                  {
                      "generation": designation.get("generation"),
                      "activation_commit": activation,
                      "unclassified_post_activation_commits": unclassified,
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          if unclassified:
              print("Unclassified post-activation commits remain.", file=sys.stderr)
              raise SystemExit(2)
          PY
      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation -w "${{ runner.temp }}/wheel"
      - name: CLI smoke
        run: python -m openline_claim_graph --help
